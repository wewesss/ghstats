version: 2

project_name: ghstats

before:
  hooks:
    - >-
      sh -c 'set -e;
      mkdir -p dist-wasm;
      GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o dist-wasm/ghstats.wasm ./cmd/wasm;
      root="$(go env GOROOT)";
      exec_js="$root/lib/wasm/wasm_exec.js";
      [ -f "$exec_js" ] || exec_js="$root/misc/wasm/wasm_exec.js";
      cp -f "$exec_js" dist-wasm/wasm_exec.js'

builds:
  - id: ghstats
    main: ./cmd/ghstats
    binary: ghstats
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: ghstats
    formats: [tar.gz]
    name_template: "ghstats_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

release:
  prerelease: auto
  extra_files:
    - glob: ./dist-wasm/*

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./dist-wasm/*

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
